name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render sample
        run: ./build/tiny_renderer_sample build/milestone1.ppm
      - name: Render deterministic flat-scene manifest
        run: |
          ./build/tiny_renderer_render tests/fixtures/flat_scene.trscene build/flat_scene_a.ppm 96 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene.trscene build/flat_scene_b.ppm 96 64 4
          cmp build/flat_scene_a.ppm build/flat_scene_b.ppm
      - name: Render deterministic explicit-camera scene
        run: |
          ./build/tiny_renderer_render tests/fixtures/flat_scene_camera.trscene build/flat_scene_camera_a.ppm 96 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene_camera.trscene build/flat_scene_camera_b.ppm 96 64 4
          cmp build/flat_scene_camera_a.ppm build/flat_scene_camera_b.ppm
          if cmp -s build/flat_scene_a.ppm build/flat_scene_camera_a.ppm; then
            echo "explicit scene camera did not change the rendered view" >&2
            exit 1
          fi
      - name: Render material shading overrides through flat-scene CLI
        run: |
          COMMON_ARGS="64 64 4 --environment-reflection tests/fixtures/environment_hdr.pfm"
          ./build/tiny_renderer_render tests/fixtures/flat_scene_shading_inherit.trscene build/shading_inherit.ppm $COMMON_ARGS
          ./build/tiny_renderer_render tests/fixtures/flat_scene_shading_lambert.trscene build/shading_lambert.ppm $COMMON_ARGS
          ./build/tiny_renderer_render tests/fixtures/flat_scene_shading_blinn.trscene build/shading_blinn.ppm $COMMON_ARGS
          cmp build/shading_inherit.ppm build/shading_lambert.ppm
          if cmp -s build/shading_lambert.ppm build/shading_blinn.ppm; then
            echo "Blinn-Phong scene override did not change reflection rendering" >&2
            exit 1
          fi
      - name: Render transparency modes through flat-scene CLI
        run: |
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_opaque.trscene build/transparency_opaque_a.ppm 64 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_opaque.trscene build/transparency_opaque_b.ppm 64 64 4
          cmp build/transparency_opaque_a.ppm build/transparency_opaque_b.ppm
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_source_alpha.trscene build/transparency_source_alpha_a.ppm 64 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_source_alpha.trscene build/transparency_source_alpha_b.ppm 64 64 4
          cmp build/transparency_source_alpha_a.ppm build/transparency_source_alpha_b.ppm
          if cmp -s build/transparency_opaque_a.ppm build/transparency_source_alpha_a.ppm; then
            echo "source-alpha scene mode did not change opacity rendering" >&2
            exit 1
          fi
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_a2c.trscene build/transparency_a2c_a.ppm 64 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_a2c.trscene build/transparency_a2c_b.ppm 64 64 4
          cmp build/transparency_a2c_a.ppm build/transparency_a2c_b.ppm
          if cmp -s build/transparency_opaque_a.ppm build/transparency_a2c_a.ppm; then
            echo "alpha-to-coverage scene mode did not change opacity rendering" >&2
            exit 1
          fi
      - name: Reject unsafe, invalid-camera, invalid-shading, or invalid-transparency flat-scene manifests
        run: |
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_unsafe.trscene build/unsafe_scene.ppm 64 64 4; then
            echo "unsafe scene manifest unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/unsafe_scene.ppm
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_camera_invalid.trscene build/invalid_camera_scene.ppm 64 64 4; then
            echo "invalid scene camera unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/invalid_camera_scene.ppm
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_shading_invalid.trscene build/invalid_shading_scene.ppm 64 64 4; then
            echo "invalid scene shading mode unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/invalid_shading_scene.ppm
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_invalid.trscene build/invalid_transparency_scene.ppm 64 64 4; then
            echo "invalid scene transparency mode unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/invalid_transparency_scene.ppm
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_a2c.trscene build/a2c_single_sample_scene.ppm 64 64 1; then
            echo "alpha-to-coverage scene unexpectedly rendered on a single-sample target" >&2
            exit 1
          fi
          test ! -e build/a2c_single_sample_scene.ppm

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure with ASan/UBSan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTINY_RENDERER_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Render sample under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/tiny_renderer_sample build/milestone1.ppm
      - name: Render flat-scene manifests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build/tiny_renderer_render tests/fixtures/flat_scene.trscene build/flat_scene.ppm 96 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene_camera.trscene build/flat_scene_camera.ppm 96 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene_shading_inherit.trscene build/shading_inherit.ppm 64 64 4 --environment-reflection tests/fixtures/environment_hdr.pfm
          ./build/tiny_renderer_render tests/fixtures/flat_scene_shading_lambert.trscene build/shading_lambert.ppm 64 64 4 --environment-reflection tests/fixtures/environment_hdr.pfm
          ./build/tiny_renderer_render tests/fixtures/flat_scene_shading_blinn.trscene build/shading_blinn.ppm 64 64 4 --environment-reflection tests/fixtures/environment_hdr.pfm
          cmp build/shading_inherit.ppm build/shading_lambert.ppm
          if cmp -s build/shading_lambert.ppm build/shading_blinn.ppm; then
            echo "Blinn-Phong scene override did not change reflection rendering under sanitizers" >&2
            exit 1
          fi
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_opaque.trscene build/transparency_opaque.ppm 64 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_source_alpha.trscene build/transparency_source_alpha.ppm 64 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_a2c.trscene build/transparency_a2c.ppm 64 64 4
          if cmp -s build/transparency_opaque.ppm build/transparency_source_alpha.ppm; then
            echo "source-alpha scene mode did not change opacity rendering under sanitizers" >&2
            exit 1
          fi
          if cmp -s build/transparency_opaque.ppm build/transparency_a2c.ppm; then
            echo "alpha-to-coverage scene mode did not change opacity rendering under sanitizers" >&2
            exit 1
          fi
      - name: Reject unsafe, invalid-camera, invalid-shading, or invalid-transparency flat-scene manifests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_unsafe.trscene build/unsafe_scene.ppm 64 64 4; then
            echo "unsafe scene manifest unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/unsafe_scene.ppm
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_camera_invalid.trscene build/invalid_camera_scene.ppm 64 64 4; then
            echo "invalid scene camera unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/invalid_camera_scene.ppm
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_shading_invalid.trscene build/invalid_shading_scene.ppm 64 64 4; then
            echo "invalid scene shading mode unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/invalid_shading_scene.ppm
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_invalid.trscene build/invalid_transparency_scene.ppm 64 64 4; then
            echo "invalid scene transparency mode unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/invalid_transparency_scene.ppm
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_transparency_a2c.trscene build/a2c_single_sample_scene.ppm 64 64 1; then
            echo "alpha-to-coverage scene unexpectedly rendered on a single-sample target" >&2
            exit 1
          fi
          test ! -e build/a2c_single_sample_scene.ppm
