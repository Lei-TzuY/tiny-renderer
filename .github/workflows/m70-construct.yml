              "    // Resolve map_Ks exactly once; direct and environment specular share this value.\n")
          replace_all("src/rasterizer.cpp", "add_emissive(base, material)", "add_emissive(base, emissive_radiance)")
          replace_all(
              "src/rasterizer.cpp",
              "add_emissive(modulate_rgb(base, ambient), material)",
              "add_emissive(modulate_rgb(base, ambient), emissive_radiance)")
          replace_all("src/rasterizer.cpp", "add_emissive(shaded, material)", "add_emissive(shaded, emissive_radiance)")

          # Fingerprint remains byte-identical for map_Ke-free assets by appending
