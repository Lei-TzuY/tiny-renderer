name: m46-cmake-patch

on:
  push:
    branches:
      - milestone-46-cascaded-directional-shadows

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add M46 CMake patch helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-46-cascaded-directional-shadows
      - name: Register cascaded shadow regression target
        shell: python
        run: |
          from pathlib import Path

          path = Path('CMakeLists.txt')
          text = path.read_text()
          old = '''    add_executable(tiny_renderer_shadow_sampling_tests tests/test_shadow_sampling.cpp)
              target_link_libraries(tiny_renderer_shadow_sampling_tests PRIVATE tiny_renderer)
              add_test(NAME tiny_renderer_shadow_sampling_tests COMMAND tiny_renderer_shadow_sampling_tests)
          
          endif()'''
          # Preserve the repository's exact indentation rather than depending on
          # the visual representation in this helper.
          old = old.replace('          ', '')
          new = '''    add_executable(tiny_renderer_shadow_sampling_tests tests/test_shadow_sampling.cpp)
              target_link_libraries(tiny_renderer_shadow_sampling_tests PRIVATE tiny_renderer)
              add_test(NAME tiny_renderer_shadow_sampling_tests COMMAND tiny_renderer_shadow_sampling_tests)
          
              add_executable(tiny_renderer_cascaded_shadow_tests tests/test_cascaded_shadow.cpp)
              target_link_libraries(tiny_renderer_cascaded_shadow_tests PRIVATE tiny_renderer)
              add_test(NAME tiny_renderer_cascaded_shadow_tests COMMAND tiny_renderer_cascaded_shadow_tests)
          
          endif()'''.replace('          ', '')
          if text.count(old) != 1:
              raise SystemExit('expected exact CMake test tail once')
          path.write_text(text.replace(old, new))
      - name: Commit test registration
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add CMakeLists.txt
          git diff --cached --check
          git commit -m "Register cascaded directional shadow tests"
          git push origin HEAD:milestone-46-cascaded-directional-shadows
