              "        || texture_binding.emissive_texture != nullptr) {\n",
              expected=1)
          replace_all(
              "src/rasterizer.cpp",
              "        && binding.specular_texture == nullptr)) {\n",
              "        && binding.specular_texture == nullptr\n"
