name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render sample
        run: ./build/tiny_renderer_sample build/milestone1.ppm
      - name: Render deterministic flat-scene manifest
        run: |
          ./build/tiny_renderer_render tests/fixtures/flat_scene.trscene build/flat_scene_a.ppm 96 64 4
          ./build/tiny_renderer_render tests/fixtures/flat_scene.trscene build/flat_scene_b.ppm 96 64 4
          cmp build/flat_scene_a.ppm build/flat_scene_b.ppm
      - name: Reject unsafe flat-scene manifest
        run: |
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_unsafe.trscene build/unsafe_scene.ppm 64 64 4; then
            echo "unsafe scene manifest unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/unsafe_scene.ppm

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure with ASan/UBSan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTINY_RENDERER_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
      - name: Render sample under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/tiny_renderer_sample build/milestone1.ppm
      - name: Render flat-scene manifest under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build/tiny_renderer_render tests/fixtures/flat_scene.trscene build/flat_scene.ppm 96 64 4
      - name: Reject unsafe flat-scene manifest under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if ./build/tiny_renderer_render tests/fixtures/flat_scene_unsafe.trscene build/unsafe_scene.ppm 64 64 4; then
            echo "unsafe scene manifest unexpectedly rendered" >&2
            exit 1
          fi
          test ! -e build/unsafe_scene.ppm
