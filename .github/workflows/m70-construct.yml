'''
          replace_once("src/mtl_loader.cpp", map_ks_block, map_ke_block)

          replace_once(
              "src/material_asset_loader.cpp",
              "    std::shared_ptr<const Texture2D> specular_texture;\n};\n",
              "    std::shared_ptr<const Texture2D> specular_texture;\n"
              "    std::shared_ptr<const Texture2D> emissive_texture;\n};\n")
          replace_once(
              "src/material_asset_loader.cpp",
              "        || definition.normal_map_filename.has_value()\n"
              "        || definition.specular_map_filename.has_value();\n",
              "        || definition.normal_map_filename.has_value()\n"
              "        || definition.specular_map_filename.has_value()\n"
              "        || definition.emissive_map_filename.has_value();\n")
          replace_once(
              "src/material_asset_loader.cpp",
              "        loaded.specular_texture = load_owned_texture(\n"
              "            resolved.library_directory,\n"
