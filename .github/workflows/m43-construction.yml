name: m43-construction

on:
  push:
    branches:
      - milestone-43-rgb-light-color
    paths:
      - .github/workflows/m43-construction.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-43-rgb-light-color
          fetch-depth: 0

      - name: Apply RGB light color vertical slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          validation = "src/rasterizer_validation.cpp"
          replace_once(
              validation,
              '''void validate_directional_light(const DirectionalLight& light) {''',
              '''void validate_light_color(const Vec3& color, const char* label) {
              if (!finite_vec3(color)
                  || color.x < 0.0F || color.x > 1.0F
                  || color.y < 0.0F || color.y > 1.0F
                  || color.z < 0.0F || color.z > 1.0F) {
                  throw std::invalid_argument(
                      std::string(label) + " color components must be finite and within [0, 1]");
              }
          }

          void validate_directional_light(const DirectionalLight& light) {''')
          replace_once(
              validation,
              '''    validate_light_coefficients(light.ambient, light.diffuse, "directional light");
          }''',
              '''    validate_light_coefficients(light.ambient, light.diffuse, "directional light");
              validate_light_color(light.color, "directional light");
          }''')
          replace_once(
              validation,
              '''    validate_light_coefficients(light.ambient, light.diffuse, "point light");
              if (!std::isfinite(light.linear_attenuation)''',
              '''    validate_light_coefficients(light.ambient, light.diffuse, "point light");
              validate_light_color(light.color, "point light");
              if (!std::isfinite(light.linear_attenuation)''')
          replace_once(
              validation,
              '''    validate_light_coefficients(light.ambient, light.diffuse, "spot light");
              if (!std::isfinite(light.linear_attenuation)''',
              '''    validate_light_coefficients(light.ambient, light.diffuse, "spot light");
              validate_light_color(light.color, "spot light");
              if (!std::isfinite(light.linear_attenuation)''')

          rasterizer = "src/rasterizer.cpp"
          replace_once(
              rasterizer,
              '''bool finite_vec3(const Vec3& value) {
              return std::isfinite(value.x) && std::isfinite(value.y) && std::isfinite(value.z);
          }

          bool material_has_specular''',
              '''bool finite_vec3(const Vec3& value) {
              return std::isfinite(value.x) && std::isfinite(value.y) && std::isfinite(value.z);
          }

          Vec3 modulate_rgb(const Vec3& a, const Vec3& b) {
              return {a.x * b.x, a.y * b.y, a.z * b.z};
          }

          bool material_has_specular''')
          replace_once(
              rasterizer,
              '''float ambient_sum(
              const DirectionalLight& directional_light,
              const PointLight& point_light,
              const FixedLightCollection& fixed_lights) {
              if (fixed_lights.count == 0U) {
                  return directional_light.enabled ? directional_light.ambient
                      : point_light.enabled ? point_light.ambient : 0.0F;
              }
              float sum = 0.0F;
              for (std::size_t i = 0U; i < fixed_lights.count; ++i) {
                  const FixedLight& light = fixed_lights.lights[i];
                  switch (light.type) {
                      case FixedLightType::Directional:
                          sum += light.directional.ambient;
                          break;
                      case FixedLightType::Point:
                          sum += light.point.ambient;
                          break;
                      case FixedLightType::Spot:
                          sum += light.spot.ambient;
                          break;
                  }
              }
              return sum;
          }''',
              '''Vec3 ambient_sum(
              const DirectionalLight& directional_light,
              const PointLight& point_light,
              const FixedLightCollection& fixed_lights) {
              if (fixed_lights.count == 0U) {
                  return directional_light.enabled
                      ? directional_light.color * directional_light.ambient
                      : point_light.enabled
                          ? point_light.color * point_light.ambient
                          : Vec3{};
              }
              Vec3 sum{};
              for (std::size_t i = 0U; i < fixed_lights.count; ++i) {
                  const FixedLight& light = fixed_lights.lights[i];
                  switch (light.type) {
                      case FixedLightType::Directional:
                          sum = sum + light.directional.color * light.directional.ambient;
                          break;
                      case FixedLightType::Point:
                          sum = sum + light.point.color * light.point.ambient;
                          break;
                      case FixedLightType::Spot:
                          sum = sum + light.spot.color * light.spot.ambient;
                          break;
                  }
              }
              return sum;
          }''')
          replace_once(
              rasterizer,
              '''    float attenuation_factor = 1.0F;
              float cone_factor = 1.0F;

              if (directional_light != nullptr) {''',
              '''    float attenuation_factor = 1.0F;
              float cone_factor = 1.0F;
              Vec3 light_color{1.0F, 1.0F, 1.0F};

              if (directional_light != nullptr) {''')
          replace_once(
              rasterizer,
              '''        ambient = directional_light->ambient;
              diffuse = directional_light->diffuse;''',
              '''        ambient = directional_light->ambient;
              diffuse = directional_light->diffuse;
              light_color = directional_light->color;''')
          replace_once(
              rasterizer,
              '''        ambient = point_light->ambient;
              diffuse = point_light->diffuse;
              viewer_position = point_light->viewer_position;''',
              '''        ambient = point_light->ambient;
              diffuse = point_light->diffuse;
              viewer_position = point_light->viewer_position;
              light_color = point_light->color;''')
          replace_once(
              rasterizer,
              '''        ambient = spot_light->ambient;
              diffuse = spot_light->diffuse;
              viewer_position = spot_light->viewer_position;''',
              '''        ambient = spot_light->ambient;
              diffuse = spot_light->diffuse;
              viewer_position = spot_light->viewer_position;
              light_color = spot_light->color;''')
          old_degenerate = '''            return base * ambient;'''
          text = Path(rasterizer).read_text()
          if text.count(old_degenerate) != 2:
              raise SystemExit(f"{rasterizer}: expected two point/spot degenerate ambient returns")
          Path(rasterizer).write_text(text.replace(
              old_degenerate,
              '''            return modulate_rgb(base, light_color) * ambient;'''))
          replace_once(
              rasterizer,
              '''    Vec3 shaded = base * (ambient + diffuse_intensity);''',
              '''    Vec3 shaded = modulate_rgb(base, light_color) * (ambient + diffuse_intensity);''')
          replace_once(
              rasterizer,
              '''                shaded = {
                      shaded.x + material.specular.x * specular_strength,
                      shaded.y + material.specular.y * specular_strength,
                      shaded.z + material.specular.z * specular_strength,
                  };''',
              '''                shaded = {
                      shaded.x + material.specular.x * light_color.x * specular_strength,
                      shaded.y + material.specular.y * light_color.y * specular_strength,
                      shaded.z + material.specular.z * light_color.z * specular_strength,
                  };''')
          replace_once(
              rasterizer,
              '''    const float ambient = ambient_sum(directional_light, point_light, fixed_lights);
              if (!finite_vec3(interpolated_normal)) {
                  return {base * ambient, opacity, false};
              }
              const float normal_length = length(interpolated_normal);
              if (!std::isfinite(normal_length) || normal_length <= kEpsilon) {
                  return {base * ambient, opacity, false};
              }''',
              '''    const Vec3 ambient = ambient_sum(directional_light, point_light, fixed_lights);
              if (!finite_vec3(interpolated_normal)) {
                  return {modulate_rgb(base, ambient), opacity, false};
              }
              const float normal_length = length(interpolated_normal);
              if (!std::isfinite(normal_length) || normal_length <= kEpsilon) {
                  return {modulate_rgb(base, ambient), opacity, false};
              }''')

          test = r'''#include <cmath>
          #include <cstddef>
          #include <cstdint>
          #include <iostream>
          #include <limits>
          #include <memory>
          #include <stdexcept>
          #include <string>
          #include <vector>

          #include "tiny_renderer/framebuffer.hpp"
          #include "tiny_renderer/model_renderer.hpp"
          #include "tiny_renderer/rasterizer.hpp"
          #include "tiny_renderer/shadow.hpp"

          using namespace tiny_renderer;

          namespace {

          int failures = 0;

          void check(bool condition, const std::string& message) {
              if (!condition) {
                  ++failures;
                  std::cerr << "FAIL: " << message << '\n';
              }
          }

          void check_near(float actual, float expected, const std::string& message, float epsilon = 1.5e-2F) {
              check(
                  std::fabs(actual - expected) <= epsilon,
                  message + " (actual=" + std::to_string(actual)
                      + ", expected=" + std::to_string(expected) + ")");
          }

          Vertex normal_vertex(const Vec3& position) {
              return Vertex::with_varyings(position, VaryingPack{0.0F, 0.0F, 1.0F});
          }

          ModelAsset model(const MaterialState& material) {
              ModelAsset asset;
              asset.mesh.vertices = {
                  normal_vertex({-0.75F, -0.75F, 0.0F}),
                  normal_vertex({0.75F, -0.75F, 0.0F}),
                  normal_vertex({0.0F, 0.75F, 0.0F}),
              };
              asset.mesh.triangles = {{0U, 1U, 2U}};
              MaterialDraw draw;
              draw.range = {0U, 1U};
              draw.material_name = "light-color";
              draw.material = material;
              asset.draws.push_back(draw);
              return asset;
          }

          MaterialState diffuse_material() {
              MaterialState material;
              material.albedo = {1.0F, 1.0F, 1.0F};
              material.specular = {0.0F, 0.0F, 0.0F};
              return material;
          }

          MaterialState specular_only_material() {
              MaterialState material;
              material.albedo = {0.0F, 0.0F, 0.0F};
              material.specular = {1.0F, 1.0F, 1.0F};
              material.shininess = 16.0F;
              return material;
          }

          DirectionalLight directional(float ambient = 0.0F, float diffuse = 1.0F) {
              DirectionalLight light;
              light.enabled = true;
              light.normal = {0U, 1U, 2U};
              light.direction_to_light = {0.0F, 0.0F, 1.0F};
              light.ambient = ambient;
              light.diffuse = diffuse;
              light.viewer_position = {0.0F, 0.0F, 4.0F};
              return light;
          }

          PointLight point(float ambient = 0.0F, float diffuse = 1.0F) {
              PointLight light;
              light.enabled = true;
              light.normal = {0U, 1U, 2U};
              light.position = {0.0F, 0.0F, 2.0F};
              light.ambient = ambient;
              light.diffuse = diffuse;
              light.viewer_position = {0.0F, 0.0F, 4.0F};
              return light;
          }

          SpotLight spot(float ambient = 0.0F, float diffuse = 1.0F) {
              SpotLight light;
              light.enabled = true;
              light.normal = {0U, 1U, 2U};
              light.position = {0.0F, 0.0F, 2.0F};
              light.direction = {0.0F, 0.0F, -1.0F};
              light.ambient = ambient;
              light.diffuse = diffuse;
              light.viewer_position = {0.0F, 0.0F, 4.0F};
              light.inner_cone_cos = 0.9F;
              light.outer_cone_cos = 0.8F;
              return light;
          }

          FixedLight fixed_directional(const DirectionalLight& light) {
              FixedLight result;
              result.type = FixedLightType::Directional;
              result.directional = light;
              return result;
          }

          FixedLight fixed_point(const PointLight& light) {
              FixedLight result;
              result.type = FixedLightType::Point;
              result.point = light;
              return result;
          }

          FixedLight fixed_spot(const SpotLight& light) {
              FixedLight result;
              result.type = FixedLightType::Spot;
              result.spot = light;
              return result;
          }

          FixedLightCollection collection(std::initializer_list<FixedLight> lights) {
              FixedLightCollection result;
              result.count = lights.size();
              std::size_t i = 0U;
              for (const FixedLight& light : lights) {
                  result.lights[i++] = light;
              }
              return result;
          }

          Framebuffer render(const ModelRenderOptions& options, const MaterialState& material = diffuse_material()) {
              Framebuffer framebuffer(65U, 65U);
              draw_model_asset(
                  framebuffer,
                  model(material),
                  Mat4::identity(), Mat4::identity(), Mat4::identity(),
                  options);
              return framebuffer;
          }

          void check_rgb(const Vec3& actual, const Vec3& expected, const std::string& label) {
              check_near(actual.x, expected.x, label + " red");
              check_near(actual.y, expected.y, label + " green");
              check_near(actual.z, expected.z, label + " blue");
          }

          void test_white_defaults_are_compatible() {
              ModelRenderOptions default_directional;
              default_directional.directional_light = directional(0.15F, 0.6F);
              ModelRenderOptions white_directional = default_directional;
              white_directional.directional_light.color = {1.0F, 1.0F, 1.0F};
              const Framebuffer a = render(default_directional);
              const Framebuffer b = render(white_directional);
              check(a.rgb8() == b.rgb8(), "explicit white directional color preserves legacy bytes");
              check(a.fnv1a64() == b.fnv1a64(), "explicit white directional color preserves legacy hash");

              ModelRenderOptions default_point;
              default_point.point_light = point(0.1F, 0.5F);
              ModelRenderOptions white_point = default_point;
              white_point.point_light.color = {1.0F, 1.0F, 1.0F};
              check(render(default_point).rgb8() == render(white_point).rgb8(),
                    "explicit white point color preserves legacy bytes");
          }

          void test_directional_color_tints_ambient_diffuse_and_specular() {
              DirectionalLight light = directional(0.2F, 0.3F);
              light.color = {0.8F, 0.4F, 0.2F};
              ModelRenderOptions options;
              options.directional_light = light;
              check_rgb(
                  render(options).color_at(32U, 32U),
                  {0.4F, 0.2F, 0.1F},
                  "directional color multiplies ambient plus Lambert diffuse");

              DirectionalLight white = directional(0.0F, 1.0F);
              ModelRenderOptions white_options;
              white_options.directional_light = white;
              DirectionalLight tinted = white;
              tinted.color = {0.25F, 0.5F, 1.0F};
              ModelRenderOptions tinted_options;
              tinted_options.directional_light = tinted;
              const Vec3 reference = render(white_options, specular_only_material()).color_at(32U, 32U);
              const Vec3 actual = render(tinted_options, specular_only_material()).color_at(32U, 32U);
              check_rgb(
                  actual,
                  {reference.x * 0.25F, reference.y * 0.5F, reference.z},
                  "directional color multiplies Blinn-Phong specular");
          }

          void test_point_and_spot_colors_share_the_rule() {
              PointLight white_point = point();
              ModelRenderOptions p_white;
              p_white.point_light = white_point;
              PointLight tinted_point = white_point;
              tinted_point.color = {1.0F, 0.25F, 0.5F};
              ModelRenderOptions p_tinted;
              p_tinted.point_light = tinted_point;
              const Vec3 point_reference = render(p_white).color_at(32U, 32U);
              const Vec3 point_actual = render(p_tinted).color_at(32U, 32U);
              check_rgb(
                  point_actual,
                  {point_reference.x, point_reference.y * 0.25F, point_reference.z * 0.5F},
                  "point-light color uses the common contribution path");

              SpotLight white_spot = spot();
              ModelRenderOptions s_white;
              s_white.fixed_lights = collection({fixed_spot(white_spot)});
              SpotLight tinted_spot = white_spot;
              tinted_spot.color = {0.5F, 1.0F, 0.25F};
              ModelRenderOptions s_tinted;
              s_tinted.fixed_lights = collection({fixed_spot(tinted_spot)});
              const Vec3 spot_reference = render(s_white).color_at(32U, 32U);
              const Vec3 spot_actual = render(s_tinted).color_at(32U, 32U);
              check_rgb(
                  spot_actual,
                  {spot_reference.x * 0.5F, spot_reference.y, spot_reference.z * 0.25F},
                  "spotlight color uses the common contribution path");
          }

          void test_mixed_colored_lights_accumulate_in_caller_order() {
              DirectionalLight red = directional(0.25F, 0.0F);
              red.color = {1.0F, 0.0F, 0.0F};
              PointLight green = point(0.25F, 0.0F);
              green.color = {0.0F, 1.0F, 0.0F};
              SpotLight blue = spot(0.25F, 0.0F);
              blue.color = {0.0F, 0.0F, 1.0F};
              ModelRenderOptions options;
              options.fixed_lights = collection({
                  fixed_directional(red), fixed_point(green), fixed_spot(blue),
              });
              check_rgb(
                  render(options).color_at(32U, 32U),
                  {0.25F, 0.25F, 0.25F},
                  "caller-ordered colored ambient contributions accumulate component-wise");
          }

          void test_shadow_preserves_colored_ambient_and_other_lights() {
              DirectionalLight red = directional(0.1F, 0.4F);
              red.color = {1.0F, 0.0F, 0.0F};
              PointLight green = point(0.0F, 0.25F);
              green.color = {0.0F, 1.0F, 0.0F};

              ModelRenderOptions options;
              options.fixed_lights = collection({fixed_directional(red), fixed_point(green)});
              options.fixed_lights.shadowed_directional_index = 0U;
              options.shadow_state.enabled = true;
              options.shadow_state.map = std::make_shared<const DepthTexture2D>(
                  1U, 1U, std::vector<float>{0.0F});
              options.shadow_state.light_view_projection = Mat4::identity();

              check_rgb(
                  render(options).color_at(32U, 32U),
                  {0.1F, 0.25F, 0.0F},
                  "shadow suppresses only colored direct light while ambient and unrelated light remain");
          }

          class RotateRgb final : public FragmentProgram {
          public:
              FragmentProgramOutput shade(const FragmentProgramInput& input) const noexcept override {
                  return {
                      {input.fixed_rgb.y, input.fixed_rgb.z, input.fixed_rgb.x},
                      input.fixed_opacity,
                      false,
                  };
              }
          };

          void test_fragment_program_observes_completed_colored_lighting() {
              DirectionalLight red = directional(0.5F, 0.0F);
              red.color = {1.0F, 0.0F, 0.0F};
              ModelRenderOptions options;
              options.fixed_lights = collection({fixed_directional(red)});
              options.fragment_program = std::make_shared<const RotateRgb>();
              check_rgb(
                  render(options).color_at(32U, 32U),
                  {0.0F, 0.0F, 0.5F},
                  "fragment program runs after completed colored fixed lighting");
          }

          void test_invalid_colors_fail_closed() {
              const ModelAsset asset = model(diffuse_material());
              {
                  ModelRenderOptions options;
                  options.directional_light = directional();
                  options.directional_light.color = {
                      std::numeric_limits<float>::quiet_NaN(), 1.0F, 1.0F};
                  bool threw = false;
                  try {
                      (void)prepare_model_asset(asset, options);
                  } catch (const std::invalid_argument&) {
                      threw = true;
                  }
                  check(threw, "non-finite directional color is rejected during preparation");
              }
              {
                  ModelRenderOptions options;
                  options.point_light = point();
                  options.point_light.color = {-0.1F, 0.5F, 0.5F};
                  bool threw = false;
                  try {
                      (void)prepare_model_asset(asset, options);
                  } catch (const std::invalid_argument&) {
                      threw = true;
                  }
                  check(threw, "negative point-light color is rejected during preparation");
              }
              {
                  SpotLight invalid = spot();
                  invalid.color = {0.5F, 0.5F, 1.1F};
                  ModelRenderOptions options;
                  options.fixed_lights = collection({fixed_spot(invalid)});
                  Framebuffer framebuffer(65U, 65U);
                  framebuffer.clear({0.2F, 0.3F, 0.4F}, 0.8F, 17U);
                  const auto before = framebuffer.rgb8();
                  const float before_depth = framebuffer.depth_at(32U, 32U);
                  const std::uint8_t before_stencil = framebuffer.stencil_at(32U, 32U);
                  bool threw = false;
                  try {
                      draw_model_asset(
                          framebuffer, asset,
                          Mat4::identity(), Mat4::identity(), Mat4::identity(),
                          options);
                  } catch (const std::invalid_argument&) {
                      threw = true;
                  }
                  check(threw, "out-of-range spotlight color rejects direct model submission");
                  check(framebuffer.rgb8() == before, "invalid color leaves framebuffer RGB untouched");
                  check(framebuffer.depth_at(32U, 32U) == before_depth,
                        "invalid color leaves framebuffer depth untouched");
                  check(framebuffer.stencil_at(32U, 32U) == before_stencil,
                        "invalid color leaves framebuffer stencil untouched");
              }
          }

          void test_prepared_list_preserves_colored_state() {
              DirectionalLight red = directional(0.15F, 0.35F);
              red.color = {1.0F, 0.25F, 0.25F};
              PointLight blue = point(0.05F, 0.2F);
              blue.color = {0.25F, 0.25F, 1.0F};
              ModelRenderOptions options;
              options.fixed_lights = collection({fixed_directional(red), fixed_point(blue)});
              const ModelAsset asset = model(diffuse_material());
              const PreparedModelSubmission prepared = prepare_model_asset(asset, options);

              Framebuffer direct(65U, 65U);
              draw_model_asset(
                  direct, asset,
                  Mat4::identity(), Mat4::identity(), Mat4::identity(), options);
              Framebuffer listed(65U, 65U);
              const PreparedModelListEntry entries[] = {{&prepared, Mat4::identity()}};
              draw_prepared_model_list(listed, entries, Mat4::identity(), Mat4::identity());
              check(listed.rgb8() == direct.rgb8(),
                    "prepared list preserves colored fixed-light bytes");
              check(listed.fnv1a64() == direct.fnv1a64(),
                    "prepared list preserves colored fixed-light hash");
          }

          }  // namespace

          int main() {
              try {
                  test_white_defaults_are_compatible();
                  test_directional_color_tints_ambient_diffuse_and_specular();
                  test_point_and_spot_colors_share_the_rule();
                  test_mixed_colored_lights_accumulate_in_caller_order();
                  test_shadow_preserves_colored_ambient_and_other_lights();
                  test_fragment_program_observes_completed_colored_lighting();
                  test_invalid_colors_fail_closed();
                  test_prepared_list_preserves_colored_state();
              } catch (const std::exception& error) {
                  std::cerr << "unexpected exception: " << error.what() << '\n';
                  return 2;
              }
              if (failures != 0) {
                  std::cerr << failures << " light-color test(s) failed\n";
                  return 1;
              }
              std::cout << "all light-color tests passed\n";
              return 0;
          }
          '''
          # Remove the workflow heredoc indentation from the generated C++ file.
          import textwrap
          Path("tests/test_light_color.cpp").write_text(textwrap.dedent(test))

          replace_once(
              "CMakeLists.txt",
              '''    add_executable(tiny_renderer_spot_shadow_tests tests/test_spot_shadow.cpp)
              target_link_libraries(tiny_renderer_spot_shadow_tests PRIVATE tiny_renderer)
              add_test(NAME tiny_renderer_spot_shadow_tests COMMAND tiny_renderer_spot_shadow_tests)
          endif()''',
              '''    add_executable(tiny_renderer_spot_shadow_tests tests/test_spot_shadow.cpp)
              target_link_libraries(tiny_renderer_spot_shadow_tests PRIVATE tiny_renderer)
              add_test(NAME tiny_renderer_spot_shadow_tests COMMAND tiny_renderer_spot_shadow_tests)

              add_executable(tiny_renderer_light_color_tests tests/test_light_color.cpp)
              target_link_libraries(tiny_renderer_light_color_tests PRIVATE tiny_renderer)
              add_test(NAME tiny_renderer_light_color_tests COMMAND tiny_renderer_light_color_tests)
          endif()''')

          status = '''# tiny-renderer current status

          This file is the compact live capability/status layer for the repository. `ROADMAP.md` retains the detailed milestone record. A milestone is closed only after its exact `main` commit passes Linux, macOS, and ASan/UBSan CI.

          ## Integrated architecture through Milestone 42

          Milestones 1–35 establish the deterministic CPU raster pipeline, indexed meshes and generalized varyings, fixed-point coverage/interpolation, depth/stencil/blend ownership, viewport/scissor, 4x MSAA, material/texture import, opacity/A2C, directional shadows, alpha-tested cutouts, and bounded fragment/vertex programs. Milestones 36–42 extend the same path with tangent-space normal mapping, Blinn-Phong specular lighting, point lights, caller-ordered fixed multi-light accumulation, point-light cubemap shadows, spotlight shading, and bounded spotlight shadow mapping.

          The current main line also integrates bounded OBJ relative indices, polygon triangulation, smoothing/generated normals, deterministic model inspection/fingerprints, multiple sibling MTL libraries, and bounded 24-bit TGA texture import through the shared image dispatch path.

          ## Milestone 43 — deterministic RGB light color

          The current integration candidate extends the existing directional, point, spotlight, shadow, normal-map, specular, fragment-program, and prepared-model pipeline with bounded per-light RGB color rather than a parallel shading path.

          Implemented acceptance surface:

          - directional, point, and spotlight records own finite `[0,1]` RGB color with white defaults that preserve established output when unused;
          - one common component-wise rule tints ambient, Lambert diffuse, and Blinn-Phong specular contributions; attenuation, cone falloff, and shadow visibility remain scalar geometric/visibility factors;
          - colored ambient remains unshadowed exactly as before, while directional/point/spot shadows continue to suppress only the associated direct contribution;
          - legacy singular directional/point submission and `FixedLightCollection` share the same shading and validation semantics, including caller-order accumulation;
          - invalid color rejects during shared/static preflight before framebuffer mutation, and prepared plans retain the validated color state through list execution;
          - regression coverage locks white compatibility, analytic directional tinting, point/spot reuse, mixed RGB accumulation, tinted specular, shadow interaction, fragment-program ordering, fail-closed invalid state, and prepared-list byte/hash equivalence;
          - no spectral, color-temperature, sRGB, exposure/tonemapping, HDR photometry, PBR, GPU, or performance claim is made.

          ## Next frontier — Milestone 44

          Promote the fixed-light/shadow architecture from one singleton association per light type to **bounded per-record typed shadow bindings**. The executable slice should allow multiple caller-ordered fixed lights of the same type to retain independent validated shadow resources while preserving whole-list preflight, resource lifetime, selective visibility, and the existing single raster/shading path. It must not silently broaden into soft-shadow filtering, cascades, automatic allocation, or unbounded scene-graph state.
          '''
          Path("STATUS.md").write_text(textwrap.dedent(status))

          roadmap_path = Path("ROADMAP.md")
          roadmap = roadmap_path.read_text()
          marker = "## Next frontier — Milestone 41\n"
          if marker not in roadmap:
              raise SystemExit("ROADMAP.md: stale M41 frontier marker not found")
          prefix = roadmap.split(marker, 1)[0]
          tail = '''### Milestone 41 — bounded deterministic spotlight shading

          - `SpotLight` integrates finite position/direction, cosine-space cone falloff, distance attenuation, shared normal binding, and Blinn-Phong response through the existing fixed-light path.
          - Caller-order accumulation with directional/point records, fragment-program ordering, normal mapping, prepared/list execution, and fail-closed validation are regression-covered.

          ### Milestone 42 — bounded deterministic spotlight shadow mapping

          - `SpotShadowMap` owns the validated spotlight capture identity plus immutable depth data; `render_spot_shadow_map` reuses prepared geometry, vertex programs, alpha-tested cutouts, homogeneous clipping, culling, and the established depth path.
          - One typed spotlight association selectively modulates that record's diffuse/specular contribution while preserving colored-independent ambient semantics and unrelated lights; prepared/list lifetime and fail-closed capture/association validation are covered.

          After M42, bounded interop slices added multiple sibling OBJ material libraries and a strict uncompressed 24-bit TGA decoder behind one shared `.ppm`/`.tga` texture-image dispatch path. These are integrated capabilities, not a replacement rendering path.

          ### Milestone 43 — deterministic RGB light color

          - Directional, point, and spotlight records carry bounded finite `[0,1]` RGB color with white defaults.
          - Ambient, Lambert diffuse, and Blinn-Phong specular use one component-wise light-color rule before exact caller-order accumulation; attenuation, cone falloff, and shadow visibility remain scalar factors.
          - Legacy singular lights, fixed-light collections, shadows, normal mapping, fragment programs, direct/range/model/prepared/list submission, and fail-closed validation stay on the existing path.
          - Regression coverage locks white compatibility, colored diffuse/specular, mixed-light accumulation, shadow/program ordering, invalid color before writes, and prepared-list equivalence.
          - This milestone does not make spectral, color-temperature, sRGB, HDR photometry, PBR, GPU, or performance claims.

          ## Next frontier — Milestone 44

          The next architectural promotion is **bounded per-record typed shadow bindings for fixed-light collections**. The current topology permits one associated shadow resource per light type, which prevents two same-type lights from being independently shadowed even though multi-light accumulation is already caller ordered and fixed-capacity.

          Acceptance for that slice should require:

          - each active fixed-light record may carry at most one matching typed shadow binding while preserving the collection's fixed capacity and caller order;
          - multiple directional, point, or spotlight records of the same type can retain independent validated shadow resources and biases without adding a second shading loop;
          - resource type/capture identity mismatches, missing resources, invalid bias, and malformed later prepared-list entries reject before any framebuffer write;
          - prepared plans own all bound shadow lifetimes, and direct/range/model/instance/list execution remains equivalent to sequential submission;
          - visibility modulates only the bound record's direct colored contribution while ambient and unrelated lights remain unchanged;
          - existing singleton shadow state remains source-compatible or receives one explicit deterministic migration path with regression evidence;
          - no PCF/soft shadows, cascades, cookies/IES, automatic shadow allocation, unbounded lights, scene graph, GPU API, or performance claim is added.

          ## Deliberate later work

          General/full OBJ and MTL syntax, general image formats beyond the bounded PPM/TGA path, mipmaps, anisotropic filtering, sRGB handling, destination alpha, transparency sorting/OIT, programmable sample locations/masks, centroid interpolation, temporal antialiasing, PCF/cascaded/soft shadows, cubemap seam filtering, cookie/IES lighting, spectral/color-temperature lighting, physically based BRDFs/IBL, general bump/parallax/displacement mapping, full shader languages/derivatives/JIT, GPU acceleration, and a general scene graph remain outside the bounded CPU teaching architecture until a higher-value executable milestone justifies them.
          '''
          roadmap_path.write_text(prefix + textwrap.dedent(tail))
          PY

