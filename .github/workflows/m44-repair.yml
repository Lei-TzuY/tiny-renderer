name: m44-repair

on:
  push:
    branches:
      - milestone-44-per-record-shadow-bindings

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-44-per-record-shadow-bindings
          fetch-depth: 0
      - name: Repair construction anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/m44-construction.yml')
          if not path.exists():
              print('construction workflow already sealed/removed')
              raise SystemExit(0)

          text = path.read_text()
          old = '"""return collection_has_point(fixed_lights)'
          new = '"""        return collection_has_point(fixed_lights)'
          count = text.count(old)
          if count == 0:
              print('construction anchor already repaired')
              raise SystemExit(0)
          if count != 2:
              raise SystemExit(f'expected exactly two stale anchor occurrences, found {count}')
          path.write_text(text.replace(old, new))
          PY

          if git diff --quiet -- .github/workflows/m44-construction.yml; then
            exit 0
          fi
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add .github/workflows/m44-construction.yml
          git commit -m "Fix M44 construction source anchor"
          git push origin HEAD:milestone-44-per-record-shadow-bindings
