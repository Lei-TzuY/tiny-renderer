              "f 1/1 2/2 3/3\n")
          Path("tests/fixtures/emissive_hdr.pfm").write_bytes(
              b"PF\n1 1\n-1.0\n" + struct.pack("<fff", 2.0, 0.5, 4.0))
          Path("tests/fixtures/emissive_hdr.mtl").write_text(
              "newmtl hdrGlow\n"
