          # Direct raster validation, derivative plumbing, and fixed shading.
          replace_once(
              "src/rasterizer.cpp",
              "Vec3 add_emissive(const Vec3& shaded, const MaterialState& material) {\n"
              "    return shaded + material.emissive;\n"
