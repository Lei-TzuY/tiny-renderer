name: m71-implement

on:
  push:
    branches:
      - milestone-71-map-ns-shininess-texture
    paths:
      - .github/workflows/m71-implement.yml
      - .github/m71_apply.py
      - .github/m71_fix.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-71-map-ns-shininess-texture
      - name: Apply coherent map_Ns vertical slice
        run: |
          python3 .github/m71_apply.py
          python3 .github/m71_fix.py
      - name: Check generated diff
        run: |
          git diff --check
          git status --short
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test complete suite
        run: ctest --test-dir build --output-on-failure
      - name: Commit verified implementation
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add CMakeLists.txt include src tests
          git commit -m "Milestone 71: owned map_Ns shininess textures"
          git push origin HEAD:milestone-71-map-ns-shininess-texture
