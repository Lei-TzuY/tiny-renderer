name: m43-construction-v2

on:
  push:
    branches:
      - milestone-43-rgb-light-color
    paths:
      - .github/workflows/m43-construction-v2.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-43-rgb-light-color
          fetch-depth: 0

      - name: Extract and harden construction patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/m43-construction.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])

          pattern = re.compile(
              r"replace_once\(\n"
              r"\s*rasterizer,\n"
              r"\s*'''\s*shaded = \{\n"
              r".*?material\.specular\.z \* specular_strength,\n"
              r"\s*\};''',\n"
              r"\s*'''\s*shaded = \{\n"
              r".*?material\.specular\.z \* light_color\.z \* specular_strength,\n"
              r"\s*\};'''\)\n",
              re.S,
          )
          replacement = '''replace_once(
              rasterizer,
              "shaded.x + material.specular.x * specular_strength",
              "shaded.x + material.specular.x * light_color.x * specular_strength")
          replace_once(
              rasterizer,
              "shaded.y + material.specular.y * specular_strength",
              "shaded.y + material.specular.y * light_color.y * specular_strength")
          replace_once(
              rasterizer,
              "shaded.z + material.specular.z * specular_strength",
              "shaded.z + material.specular.z * light_color.z * specular_strength")
          '''
          script, count = pattern.subn(replacement, script, count=1)
          if count != 1:
              raise SystemExit(f'expected to harden one specular patch block, found {count}')

          # Make the generated regression test independent of transitive includes.
          script = script.replace(
              '#include <iostream>\\n          #include <limits>',
              '#include <iostream>\\n          #include <initializer_list>\\n          #include <limits>',
              1,
          )
          script = script.replace(
              '#include "tiny_renderer/framebuffer.hpp"\\n',
              '#include "tiny_renderer/framebuffer.hpp"\\n          #include "tiny_renderer/fragment_program.hpp"\\n',
              1,
          )
          Path('/tmp/m43_apply.py').write_text(script)
          PY
          python3 /tmp/m43_apply.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTINY_RENDERER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run full tests
        run: ctest --test-dir build --output-on-failure

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/rasterizer.cpp src/rasterizer_validation.cpp tests/test_light_color.cpp CMakeLists.txt STATUS.md ROADMAP.md
          git commit -m "Milestone 43: implement deterministic RGB light color"
          git push origin HEAD:milestone-43-rgb-light-color
