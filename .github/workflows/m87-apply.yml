name: m87-apply

on:
  push:
    branches:
      - milestone-87-offline-prepared-scene

permissions:
  contents: write

jobs:
  apply-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M87 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded M87 source patch
        run: python3 tools/m87_apply.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run complete test suite
        run: ctest --test-dir build --output-on-failure

      - name: Render deterministic sample
        run: ./build/tiny_renderer_sample

      - name: Commit verified production slice and remove construction files
        run: |
          git rm -f tools/m87_apply.py .github/workflows/m87-apply.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "Milestone 87: reusable offline prepared scenes"
          git push
