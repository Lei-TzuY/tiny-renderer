name: m70-construct

on:
  push:
    branches:
      - milestone-70-map-ke-emissive-textures

permissions:
  contents: write

jobs:
  construct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build Milestone 70 atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import struct

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 or (expected is not None and count != expected):
                  raise SystemExit(f"{path}: replacement count {count}, expected {expected}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Texture storage tracks a second role-agnostic invariant: finite
          # non-negative linear radiance may exceed one, unlike reflectance maps.
          replace_once(
              "include/tiny_renderer/texture.hpp",
              "    [[nodiscard]] bool texels_within_unit_range() const noexcept { return texels_within_unit_range_; }\n",
              "    [[nodiscard]] bool texels_within_unit_range() const noexcept { return texels_within_unit_range_; }\n"
              "    [[nodiscard]] bool texels_nonnegative() const noexcept { return texels_nonnegative_; }\n")
          replace_once(
              "include/tiny_renderer/texture.hpp",
              "    bool texels_within_unit_range_{true};\n    TextureTransferFunction source_transfer_function_{TextureTransferFunction::Linear};\n",
              "    bool texels_within_unit_range_{true};\n"
              "    bool texels_nonnegative_{true};\n"
              "    TextureTransferFunction source_transfer_function_{TextureTransferFunction::Linear};\n")
          replace_once(
              "src/texture.cpp",
              "        value = decode_source_texel(value, transfer_function);\n"
              "        texels_within_unit_range_ = texels_within_unit_range_ && within_unit_range(value);\n",
              "        value = decode_source_texel(value, transfer_function);\n"
              "        texels_nonnegative_ = texels_nonnegative_\n"
              "            && value.x >= 0.0F && value.y >= 0.0F && value.z >= 0.0F;\n"
              "        texels_within_unit_range_ = texels_within_unit_range_ && within_unit_range(value);\n")

          # Rich MTL + asset ownership surface.
          replace_once(
              "include/tiny_renderer/mtl_loader.hpp",
              "    std::optional<std::string> specular_map_filename;\n};\n",
              "    std::optional<std::string> specular_map_filename;\n"
              "    // Linear/HDR emissive radiance texture. Values may exceed one but\n"
              "    // must remain finite and non-negative when submitted for rendering.\n"
              "    std::optional<std::string> emissive_map_filename;\n};\n")
          replace_once(
              "include/tiny_renderer/model.hpp",
              "    std::shared_ptr<const Texture2D> specular_texture;\n};\n",
              "    std::shared_ptr<const Texture2D> specular_texture;\n"
              "    // Optional linear/HDR emissive-radiance multiplier sharing the\n"
              "    // canonical material UV/sampler path.\n"
              "    std::shared_ptr<const Texture2D> emissive_texture;\n};\n")
          replace_once(
              "include/tiny_renderer/obj_loader.hpp",
              "    std::shared_ptr<const Texture2D> specular_texture;\n};\n",
              "    std::shared_ptr<const Texture2D> specular_texture;\n"
              "    std::shared_ptr<const Texture2D> emissive_texture;\n};\n")
          replace_once(
              "include/tiny_renderer/obj_loader.hpp",
              "// Texture-transfer interpretation for material asset import. Only the diffuse\n"
              "// color role is caller-selectable; opacity, normal, and bounded specular maps\n"
              "// are treated as linear data textures. Linear preserves historical import\n",
              "// Texture-transfer interpretation for material asset import. Only the diffuse\n"
              "// color role is caller-selectable; opacity, normal, specular, and emissive maps\n"
              "// are treated as linear data textures. Linear preserves historical import\n")
          replace_once(
              "include/tiny_renderer/rasterizer.hpp",
              "    const Texture2D* specular_texture{nullptr};\n};\n",
              "    const Texture2D* specular_texture{nullptr};\n"
              "    // Optional linear/HDR emissive-radiance multiplier. It reuses the\n"
              "    // same UV channels, sampler, mip chain, and raster gradients.\n"
              "    const Texture2D* emissive_texture{nullptr};\n};\n")

          replace_once(
              "src/mtl_loader.cpp",
              "    bool has_map_ks{false};\n    bool has_d{false};\n",
              "    bool has_map_ks{false};\n    bool has_map_ke{false};\n    bool has_d{false};\n")
          map_ks_block = '''        if (directive == "map_Ks" && allow_maps) {
            if (!pending) {
                fail(line_number, "map_Ks requires a preceding newmtl");
            }
            if (pending->has_map_ks) {
                fail(line_number, "material '" + pending->name + "' defines map_Ks more than once");
            }
            std::string filename;
            std::string extra;
            if (!(line >> filename) || (line >> extra)) {
                fail(line_number, "map_Ks must contain exactly one filename and no options");
            }
            validate_sibling_texture_filename(filename, line_number, "map_Ks");
            pending->asset.specular_map_filename = filename;
            pending->has_map_ks = true;
            continue;
        }
'''
          map_ke_block = map_ks_block + '''
        if (directive == "map_Ke" && allow_maps) {
            if (!pending) {
                fail(line_number, "map_Ke requires a preceding newmtl");
            }
            if (pending->has_map_ke) {
                fail(line_number, "material '" + pending->name + "' defines map_Ke more than once");
            }
            std::string filename;
