              "f 1/1 2/2 3/3\n")

          Path("tests/test_emissive_texture.cpp").write_text(r'''#include <cmath>
#include <cstddef>
#include <cstdint>
#include <filesystem>
#include <iostream>
#include <limits>
#include <memory>
#include <optional>
#include <span>
