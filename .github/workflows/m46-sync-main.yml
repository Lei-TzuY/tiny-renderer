name: m46-sync-main

on:
  push:
    branches:
      - milestone-46-cascaded-directional-shadows

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Add M46 main sync helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-46-cascaded-directional-shadows
          fetch-depth: 0
      - name: Merge latest main without semantic edits
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:milestone-46-cascaded-directional-shadows
