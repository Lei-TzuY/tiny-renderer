name: m87-cleanup

on:
  push:
    branches:
      - milestone-87-offline-prepared-scene

permissions:
  contents: write

jobs:
  cleanup-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M87 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unused compatibility wrappers
        run: python3 tools/m87_cleanup.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build without compiler warnings
        run: |
          set -o pipefail
          cmake --build build --parallel 2 2>&1 | tee build.log
          if grep -E "(^|: )warning:" build.log; then
            echo "compiler warnings detected"
            exit 1
          fi

      - name: Run complete test suite
        run: ctest --test-dir build --output-on-failure

      - name: Check whitespace
        run: git diff --check

      - name: Commit clean M87 candidate and remove construction artifacts
        run: |
          git rm -f tools/m87_cleanup.py .github/workflows/m87-cleanup.yml milestone1.ppm
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "Harden M87 prepared-scene integration"
          git push
