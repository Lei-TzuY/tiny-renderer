name: m46-runtime-patch

on:
  push:
    branches:
      - milestone-46-cascaded-directional-shadows

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add M46 runtime patch helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-46-cascaded-directional-shadows
      - name: Apply exact cascade selection patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/rasterizer.cpp')
          text = path.read_text()
          old = '''float directional_shadow_visibility_world(
              const ShadowState& shadow,
              const Vec3& world_position) {
              if (!shadow.enabled) {
                  return 1.0F;
              }
              if (!shadow.map) {
                  throw std::logic_error(
                      "validated per-record directional shadow lost its depth texture");
              }
              const Vec4 clip = shadow.light_view_projection
                  * Vec4{world_position.x, world_position.y, world_position.z, 1.0F};
              return projected_shadow_visibility(
                  *shadow.map, shadow.bias, shadow.sampling, clip);
          }
          '''
          new = '''float directional_shadow_visibility_world(
              const ShadowState& shadow,
              const Vec3& world_position) {
              if (!shadow.enabled) {
                  return 1.0F;
              }
              if (shadow.cascades) {
                  const float view_depth =
                      shadow.cascades->view_depth_for_world_position(world_position);
                  const DirectionalShadowCascade* cascade =
                      shadow.cascades->cascade_for_view_depth(view_depth);
                  if (cascade == nullptr) {
                      return 1.0F;
                  }
                  const Vec4 clip = cascade->light_view_projection
                      * Vec4{world_position.x, world_position.y, world_position.z, 1.0F};
                  return projected_shadow_visibility(
                      *cascade->map, cascade->bias, cascade->sampling, clip);
              }
              if (!shadow.map) {
                  throw std::logic_error(
                      "validated per-record directional shadow lost its depth texture or cascade set");
              }
              const Vec4 clip = shadow.light_view_projection
                  * Vec4{world_position.x, world_position.y, world_position.z, 1.0F};
              return projected_shadow_visibility(
                  *shadow.map, shadow.bias, shadow.sampling, clip);
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one directional shadow runtime function')
          path.write_text(text.replace(old, new))
      - name: Commit runtime integration
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src/rasterizer.cpp
          git diff --cached --check
          git commit -m "Integrate cascaded directional shadow selection"
          git push origin HEAD:milestone-46-cascaded-directional-shadows
