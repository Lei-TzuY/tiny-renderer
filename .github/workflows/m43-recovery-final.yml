name: m43-recovery-final

on:
  push:
    branches:
      - milestone-43-rgb-light-color
    paths:
      - .github/workflows/m43-recovery-final.yml

permissions:
  contents: write

jobs:
  recover-verify-seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-43-rgb-light-color
          fetch-depth: 0

      - name: Repair roadmap staging and apply production slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text()
          marker = '## Next frontier — Milestone 41\n'
          if marker not in roadmap:
              raise SystemExit('ROADMAP.md: expected stale M41 frontier marker not found')
          prefix = roadmap.split(marker, 1)[0]
          bridge = '''### Milestone 41 — bounded deterministic spotlight shading

          - `SpotLight` integrates finite position/direction, cosine-space cone falloff, distance attenuation, shared normal binding, and Blinn-Phong response through the existing fixed-light path.
          - Caller-order accumulation with directional/point records, fragment-program ordering, normal mapping, prepared/list execution, and fail-closed validation are regression-covered.

          ### Milestone 42 — bounded deterministic spotlight shadow mapping

          - `SpotShadowMap` owns the validated spotlight capture identity plus immutable depth data; `render_spot_shadow_map` reuses prepared geometry, vertex programs, alpha-tested cutouts, homogeneous clipping, culling, and the established depth path.
          - One typed spotlight association selectively modulates that record's diffuse/specular contribution while preserving ambient semantics and unrelated lights; prepared/list lifetime and fail-closed capture/association validation are covered.

          After M42, bounded interop slices added multiple sibling OBJ material libraries and a strict uncompressed 24-bit TGA decoder behind the shared texture-image dispatch path. These are integrated capabilities, not a replacement rendering path.

          ## Next frontier — Milestone 43

          '''
          roadmap_path.write_text(prefix + textwrap.dedent(bridge))

          workflow = Path('.github/workflows/m43-construction-v3.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/m43_apply.py').write_text(script)
          PY
          python3 /tmp/m43_apply.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTINY_RENDERER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run full tests
        run: ctest --test-dir build --output-on-failure

      - name: Seal verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/m43-construction.yml \
                .github/workflows/m43-construction-v2.yml \
                .github/workflows/m43-construction-v3.yml \
                .github/workflows/m43-recovery-final.yml
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add -A
          git commit -m "Milestone 43: deterministic RGB light color"
          git push origin HEAD:milestone-43-rgb-light-color
