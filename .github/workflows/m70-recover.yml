name: m70-recover

on:
  push:
    branches:
      - milestone-70-map-ke-emissive-textures
    paths:
      - .github/workflows/m70-recover.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover Milestone 70 construction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/m70-construct.yml').read_text()
          marker = '        run: |\n'
          if marker not in source:
              raise SystemExit('M70 construction run block marker not found')
          payload = source.split(marker, 1)[1]
          lines = []
          in_triple_single = False
          for raw in payload.splitlines():
              if in_triple_single:
                  line = raw
                  if raw.count("'''") % 2 == 1:
                      in_triple_single = False
              else:
                  line = raw[10:] if raw.startswith('          ') else raw
                  if line.count("'''") % 2 == 1:
                      in_triple_single = True
              lines.append(line)
          if in_triple_single:
              raise SystemExit('unterminated triple-quoted payload while recovering M70 script')
          Path('/tmp/m70-construct.sh').write_text('\n'.join(lines) + '\n')
          PY

          bash /tmp/m70-construct.sh

          test ! -e .github/workflows/m70-construct.yml
          rm .github/workflows/m70-recover.yml
          git diff --check
          git add -A
          git commit -m "M70: remove recovery workflow"
          git push origin HEAD:milestone-70-map-ke-emissive-textures
